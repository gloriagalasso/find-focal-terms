name: 02 – Analysis
# Requires 01 to have run first (downloads focal_terms_full.parquet from R2)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode (must match what 01 last produced)"
        required: true
        default: "test"
        type: choice
        options:
          - test
          - full

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONUNBUFFERED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install polars pyarrow boto3 numpy matplotlib

      - name: Create directories
        run: mkdir -p output visualizations/v3_16042026/fullsample_visualizations

      - name: Download focal_terms_full.parquet from R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_ACCESS_SECRET }}
        run: |
          python - <<'EOF'
          import boto3, os
          s3 = boto3.client(
              's3',
              endpoint_url='https://c6ec75bde4f8f0d307d63edb221db6a3.r2.cloudflarestorage.com',
              aws_access_key_id=os.environ['AWS_ACCESS_KEY_ID'],
              aws_secret_access_key=os.environ['AWS_SECRET_ACCESS_KEY'],
              region_name='auto'
          )
          key = f"outcomes/01_focal_terms_${{ github.event.inputs.mode }}.parquet"
          dest = 'output/focal_terms_full.parquet'
          print(f"Downloading {key} -> {dest}...")
          s3.download_file('gloria-hiwi', key, dest)
          print(f"  saved ({os.path.getsize(dest) / 1e6:.1f} MB)")
          EOF

      - name: Run 02_analysis.py
        run: python scripts/02_analysis.py

      - name: Upload outputs to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_ACCESS_SECRET }}
        run: |
          python - <<'EOF'
          import boto3, os
          s3 = boto3.client(
              's3',
              endpoint_url='https://c6ec75bde4f8f0d307d63edb221db6a3.r2.cloudflarestorage.com',
              aws_access_key_id=os.environ['AWS_ACCESS_KEY_ID'],
              aws_secret_access_key=os.environ['AWS_SECRET_ACCESS_KEY'],
              region_name='auto'
          )
          mode = '${{ github.event.inputs.mode }}'
          files = {
              'output/focal_term_counts_per_patent_full.parquet': f'outcomes/02_focal_term_counts_{mode}.parquet',
              'output/term_frequency_full.parquet':               f'outcomes/02_term_frequency_{mode}.parquet',
              'output/task2_analysis.json':                       f'outcomes/02_analysis_{mode}.json',
              'visualizations/v3_16042026/fullsample_visualizations/histogram_focal_terms_full.png': f'outcomes/02_histogram_{mode}.png',
          }
          for src, key in files.items():
              print(f"Uploading {src} -> {key} ({os.path.getsize(src) / 1e6:.2f} MB)...")
              s3.upload_file(src, 'gloria-hiwi', key)
              print("  done.")
          EOF
