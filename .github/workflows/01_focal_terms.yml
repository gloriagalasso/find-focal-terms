name: 01 – Focal Terms

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode: test (50k rows) or full (all data)"
        required: true
        default: "test"
        type: choice
        options:
          - test
          - full

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      POLARS_MAX_THREADS: "4"
      PYTHONUNBUFFERED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install polars pyarrow boto3

      - name: Create directories
        run: mkdir -p data output

      - name: Download parquet files from R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_ACCESS_SECRET }}
        run: |
          python - <<'EOF'
          import boto3, os
          s3 = boto3.client(
              's3',
              endpoint_url='https://977a2b4bf497816f10a436148fcf51b9.r2.cloudflarestorage.com',
              aws_access_key_id=os.environ['AWS_ACCESS_KEY_ID'],
              aws_secret_access_key=os.environ['AWS_SECRET_ACCESS_KEY'],
              region_name='auto'
          )
          bucket = 'parquetunistuttgart'
          files = {
              'FullSampleGloria_Pat_GlinerLabels.parquet':           'data/FullSampleGloria_Pat_GlinerLabels_16042026.parquet',
              'FullSampleGloria_Link_PmidOa.parquet':                'data/FullSampleGloria_Link_PmidOa_16042026.parquet',
              'FullSampleGloria_Pmed_GlinerLabels_16042026.parquet': 'data/FullSampleGloria_Pmed_GlinerLabels_16042026.parquet',
          }
          for r2_key, local_path in files.items():
              print(f"Downloading {r2_key} -> {local_path}...")
              s3.download_file(bucket, r2_key, local_path)
              print(f"  saved ({os.path.getsize(local_path) / 1e6:.1f} MB)")
          EOF
          ls -lh data/*.parquet

      - name: Sample data (test mode only)
        if: ${{ github.event.inputs.mode == 'test' }}
        run: |
          python - <<'EOF'
          import polars as pl
          from pathlib import Path
          SAMPLE_ROWS = 50_000
          for fname in [
              'FullSampleGloria_Pat_GlinerLabels_16042026.parquet',
              'FullSampleGloria_Link_PmidOa_16042026.parquet',
              'FullSampleGloria_Pmed_GlinerLabels_16042026.parquet',
          ]:
              path = Path("data") / fname
              df = pl.read_parquet(path, n_rows=SAMPLE_ROWS)
              df.write_parquet(path)
              print(f"Sampled {fname}: {df.shape[0]:,} rows")
          EOF

      - name: Run 01_focal_terms.py
        run: python full-notebook/01_focal_terms.py

      - name: Upload focal_terms_full.parquet to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_ACCESS_SECRET }}
        run: |
          python - <<'EOF'
          import boto3, os
          s3 = boto3.client(
              's3',
              endpoint_url='https://977a2b4bf497816f10a436148fcf51b9.r2.cloudflarestorage.com',
              aws_access_key_id=os.environ['AWS_ACCESS_KEY_ID'],
              aws_secret_access_key=os.environ['AWS_SECRET_ACCESS_KEY'],
              region_name='auto'
          )
          src = 'output/focal_terms_full.parquet'
          key = f"results/focal_terms_full_${{ github.event.inputs.mode }}.parquet"
          print(f"Uploading {src} -> {key} ({os.path.getsize(src) / 1e6:.1f} MB)...")
          s3.upload_file(src, 'parquetunistuttgart', key)
          print("Done.")
          EOF
