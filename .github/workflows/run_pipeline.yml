name: Run Focal Terms Pipeline

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode: test (50k rows sample) or full (all data)"
        required: true
        default: "test"
        type: choice
        options:
          - test
          - full

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      POLARS_MAX_THREADS: "4"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install \
            polars pyarrow pandas numpy matplotlib scipy scikit-learn \
            sentence-transformers

      - name: Create directories
        run: mkdir -p data output visualizations

      - name: Download parquet files from public share
        run: |
          BASE_URL="https://bwsyncandshare.kit.edu/s/TgyTgtxLedq3wF5/download?path=%2F&files"
          curl -L --fail -o data/FullSampleGloria_Pat_GlinerLabels_16042026.parquet \
            "${BASE_URL}=FullSampleGloria_Pat_GlinerLabels_16042026.parquet"
          curl -L --fail -o data/FullSampleGloria_Link_PmidOa_16042026.parquet \
            "${BASE_URL}=FullSampleGloria_Link_PmidOa_16042026.parquet"
          curl -L --fail -o data/FullSampleGloria_Pmed_GlinerLabels_16042026.parquet \
            "${BASE_URL}=FullSampleGloria_Pmed_GlinerLabels_16042026.parquet"
          echo "Downloaded files:"
          ls -lh data/*.parquet

      - name: Sample data (test mode only)
        if: ${{ github.event.inputs.mode == 'test' }}
        run: |
          python - <<'EOF'
          import polars as pl
          from pathlib import Path
          SAMPLE_ROWS = 50_000
          data_dir = Path("data")
          files = [
              'FullSampleGloria_Pat_GlinerLabels_16042026.parquet',
              'FullSampleGloria_Link_PmidOa_16042026.parquet',
              'FullSampleGloria_Pmed_GlinerLabels_16042026.parquet',
          ]
          for fname in files:
              path = data_dir / fname
              df = pl.read_parquet(path, n_rows=SAMPLE_ROWS)
              df.write_parquet(path)
              print(f"Sampled {fname}: {df.shape[0]:,} rows")
          EOF

      - name: Run 01 - Focal Terms
        run: python full-notebook/01_focal_terms.py

      - name: Run 02 - Analysis
        run: python full-notebook/02_analysis.py

      - name: Run 03 - Semantic Similarity
        run: python full-notebook/03_semantic.py

      - name: Export viewer_data.json
        run: |
          mkdir -p public
          python - <<'EOF'
          import polars as pl, json, numpy as np
          from pathlib import Path

          out_dir = Path("output")

          # ── Task 1/2: focal terms ──────────────────────────────────────────
          focal = pl.read_parquet(out_dir / "focal_terms_full.parquet")

          per_patent = focal.group_by("patent_id").agg(
              pl.col("focal_term").n_unique().alias("n")
          )
          median_val = per_patent["n"].median()

          summary = {
              "total_focal_pairs":       int(len(focal)),
              "unique_patents":          int(focal["patent_id"].n_unique()),
              "unique_terms":            int(focal["focal_term"].n_unique()),
              "median_terms_per_patent": int(median_val) if median_val is not None else 0,
          }

          top_terms = (
              focal.group_by("focal_term")
              .agg(pl.col("patent_id").n_unique().alias("patent_count"))
              .sort("patent_count", descending=True)
              .head(20)
              .to_dicts()
          )

          vc = per_patent["n"].value_counts().sort("n")
          count_col = "count" if "count" in vc.columns else "counts"
          distribution = [
              {"bin": int(r["n"]), "count": int(r[count_col])}
              for r in vc.iter_rows(named=True)
              if r["n"] <= 50
          ]

          # ── Task 3: semantic similarity ────────────────────────────────────
          sim_path = out_dir / "task3_cosine_similarity_sample.parquet"
          similarity = {}
          if sim_path.exists():
              sim = pl.read_parquet(sim_path)
              vals = sim["cosine_similarity"].to_numpy()
              similarity = {
                  "mean":   round(float(vals.mean()), 4),
                  "median": round(float(np.median(vals)), 4),
                  "std":    round(float(vals.std()), 4),
                  "min":    round(float(vals.min()), 4),
                  "max":    round(float(vals.max()), 4),
                  "n_pairs": int(len(vals)),
                  "high_examples": (
                      sim.sort("cosine_similarity", descending=True)
                      .head(10)
                      .select("patent_id", "focal_term", "cosine_similarity")
                      .to_dicts()
                  ),
                  "low_examples": (
                      sim.sort("cosine_similarity")
                      .head(10)
                      .select("patent_id", "focal_term", "cosine_similarity")
                      .to_dicts()
                  ),
              }

          payload = {
              "summary":      summary,
              "top_terms":    top_terms,
              "distribution": distribution,
              "similarity":   similarity,
          }

          out_path = Path("public/viewer_data.json")
          out_path.write_text(json.dumps(payload, indent=2))
          print(f"viewer_data.json written ({out_path.stat().st_size / 1024:.1f} KB)")
          EOF

      - name: Commit and push viewer_data.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/viewer_data.json
          git commit -m "ci: update viewer_data.json (${{ github.event.inputs.mode }} mode)" \
            || echo "Nothing to commit"
          git push
